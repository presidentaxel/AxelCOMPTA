# TVA déductible par défaut sur les dépenses venues de la banque (AXE-831).
#
# La banque ne donne pas la TVA. Sans justificatif, on l'estime par catégorie :
# `taux` est le taux de TVA supposé de la dépense (en %), `recuperable` la part
# de cette TVA qu'on déduit (en %). Le reste de la TVA reste en charge.
#
# Prudence : en cas de doute, rien n'est récupéré. Une TVA oubliée se rattrape
# avec le justificatif ; une TVA déduite à tort se paie en redressement.
#
# Une catégorie absente d'une version ne récupère rien. Un dossier en franchise
# de TVA ne récupère jamais rien (art. 293 B CGI), quelle que soit la table.
#
# Hypothèse du pack VTC : le véhicule est affecté exclusivement à l'activité de
# transport de personnes. C'est la condition de l'exception qui ouvre la
# déduction (BOI-TVA-DED-30-30-20, transport public de voyageurs). Un véhicule
# à usage mixte relève de l'exclusion : ces lignes passent alors à 0, ou à 80 %
# pour le carburant (art. 298, 4-1° CGI).
#
# Données versionnées : une nouvelle règle s'ajoute dans une nouvelle version,
# datée, jamais en réécrivant une version passée. Le montant posé avec le code
# « deductible_estimee_… » reste celui calculé ici. Un montant lu plus tard sur
# un justificatif est une autre valeur, code « deductible_relevee_… » : il
# remplace l'estimation, il ne modifie pas cette table.
# À valider par l'expert-comptable (AXE-815) avant la première liasse réelle.

